<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 38" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="foldLeft" x1="4" y1="6" x2="15" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="foldMid" x1="16" y1="2" x2="28" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="29" y1="4" x2="41" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Pane 1 (Left Pane) -->
  <path d="M4 10 L15 5 L15 31 L4 36 Z" fill="url(#foldLeft)" opacity="0.9" filter="url(#glassGlow)"/>
  <path d="M4.5 10.5 L14.5 5.5" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Pane 2 (Center Pane) -->
  <path d="M16 4 L28 8 L28 34 L16 30 Z" fill="url(#foldMid)" opacity="0.95" filter="url(#glassGlow)"/>
  <path d="M16.5 4.5 L27.5 8.5" stroke="url(#sheen)" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Pane 3 (Right Pane) -->
  <path d="M29 8 L41 3 L41 29 L29 33 Z" fill="url(#foldRight)" opacity="0.92" filter="url(#glassGlow)"/>
  <path d="M29.5 8.5 L40.5 3.5" stroke="url(#sheen)" stroke-width="1.2" stroke-linecap="round"/>
</svg>